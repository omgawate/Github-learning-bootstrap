<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <!-- bg-purple  use and give other backgroud color and use  external css-->
      <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">
            <img
              src="images/logo-light.png"
              class="img-fluid"
              alt="Logo"
              width="110"
              height="60"
              class="d-inline-block align-text-top text-white"
            />
            Goods Cafe</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"
                  >HOME</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">ABOUT</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle active bg-danger"
                  href="gallary.html"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  GALLARY
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="gallary.html">Photo</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="gallary.html">Video</a>
                  </li>
                  <li><hr class="dropdown-divider" /></li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="services.html">SERVICES</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="product.html">PRODUCT</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">CONTACT</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-danger" type="submit">Search</button>
            </form>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="mt-5">
        <div class="container">
          <div class="row">
            <div class="col-md-3">
              <img src="images/coffie 1.jpg" class="img-fluid" />
            </div>
            <div class="col-md-3">
              <img src="images/coffie 1.jpg" class="img-fluid" />
            </div>

            <div class="col-md-3">
              <img src="images/coffie 1.jpg" class="img-fluid" />
            </div>
            <div class="col-md-3">
              <img src="images/coffie 1.jpg" class="img-fluid" />
            </div>
          </div>
        </div>
      </section>
      <section class="mt-5">
        <div class="container">
          <div class="row">
            <div class="col-md-6">
              <div
                class="progress"
                role="progressbar"
                aria-label="Success example"
                aria-valuenow="25"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="progress-bar progress-bar-striped progress-bar-animated text-bg-success" style="width: 25%">
                  Html
                </div>
              </div>
              <div
                class="progress"
                role="progressbar"
                aria-label="Info example"
                aria-valuenow="50"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="progress-bar progress-bar-striped progress-bar-animated text-bg-info" style="width: 50%">
                  Css
                </div>
              </div>
              <div
                class="progress"
                role="progressbar"
                aria-label="Warning example"
                aria-valuenow="75"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="progress-bar progress-bar-striped progress-bar-animated text-bg-warning" style="width: 75%">
                  Javascript
                </div>
              </div>
              <div
                class="progress"
                role="progressbar"
                aria-label="Danger example"
                aria-valuenow="100"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="progress-bar progress-bar-striped progress-bar-animated text-bg-danger" style="width: 100%">
                  React
                </div>
              </div>
            </div>
            <div class="col-md-6"></div>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
